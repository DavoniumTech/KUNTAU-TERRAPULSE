<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#13333a"/><stop offset="1" stop-color="#233d34"/></linearGradient></defs><rect width="900" height="330" rx="24" fill="url(#g)"/><g transform="translate(90 48)"><circle cx="85" cy="65" r="34" fill="#b97b54"/><path d="M52 55q15-45 72-25l17 20-22 3-23-9-20 20z" fill="#263b46"/><path d="M44 106q42-30 84 0l24 120H18z" fill="#d79a4b"/><path d="M54 220l-14 52h33l19-53m28 0 18 53h34l-17-55" fill="#1a3032"/><path d="M163 128l-33 39" stroke="#b97b54" stroke-width="18" stroke-linecap="round"/><rect x="180" y="114" width="108" height="138" rx="10" fill="#e2ebdc" stroke="#f5f7e9" stroke-width="4"/><path d="M197 144h74m-74 24h74m-74 24h53m-53 24h64" stroke="#5b977d" stroke-width="7" stroke-linecap="round"/><circle cx="254" cy="253" r="25" fill="#5a9d7c" stroke="#e2ebdc" stroke-width="5"/><path d="M242 253l9 9 17-20" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g fill="#edf7f1" font-family="Arial,sans-serif"><text x="465" y="97" font-size="23" font-weight="700">A satellite signal is a clue, not a verdict.</text><text x="465" y="139" font-size="16" fill="#b9d2c6">Visit the place. Ask what people observed.</text><text x="465" y="169" font-size="16" fill="#b9d2c6">Record the date, rainfall, water marks and local context.</text><text x="465" y="199" font-size="16" fill="#b9d2c6">Only then can the signal be interpreted more confidently.</text></g></svg>
